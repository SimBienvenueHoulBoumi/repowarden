# À fusionner dans le .gitlab-ci.yml du projet.
# Rendre le pipeline obligatoire : Settings → Merge requests →
# "Pipelines must succeed".
include:
  # repowarden hébergé sur votre GitLab (recommandé : accès interne, pas de dépendance externe)
  - project: outils/repowarden
    ref: v4 # dernière 4.x (vX.Y.Z pour figer)
    file: templates/gitlab/repowarden.gitlab-ci.yml
  # ou depuis GitHub (dépôt public) :
  # - remote: https://raw.githubusercontent.com/simdevWarden/repowarden/v4/templates/gitlab/repowarden.gitlab-ci.yml

stages: [test]

repowarden:
  # Image contenant bash, git, curl et les outils du projet (JDK, node, python…)
  image: eclipse-temurin:21-jdk
  variables:
    REPOWARDEN_STRICT: "true"
