# Vérifications repowarden en CI (obligatoires pour merger : à déclarer en
# "required status check" dans les règles de protection de la branche).
name: repowarden

on:
  pull_request:
    # edited : revérifie quand le titre de la PR change (message du commit en squash) ;
    # ready_for_review : une PR brouillon ouverte par le suivi des tickets n'a
    # pas encore eu de CI (jeton des Actions)
    types: [opened, synchronize, reopened, edited, ready_for_review]
  push:
    branches: [main]
  # Lancé par le workflow de release sur sa PR (release-auto)
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repowarden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # historique complet : messages de commit, diff depuis la base

      # Outils du projet nécessaires au formatage et aux tests, ex. :
      # - uses: actions/setup-java@v6
      #   with: { distribution: temurin, java-version: 21, cache: maven }
      # - uses: actions/setup-node@v7
      #   with: { node-version: 24, cache: npm }
      # - run: npm ci

      - uses: simdevWarden/repowarden@v4
        with:
          strict: true
